syntax = "proto3";

option java_multiple_files = true;   // one Java file per message
package dk.via.sep3.generated;       // generated Java classes go into this package

service UserService {
  rpc AddUser(AddUserRequest) returns (UserResponse);
  rpc GetAllUsers(GetAllUsersRequest) returns (UserListResponse);
}

message User {
  int32 id = 1;
  string name = 2;
  string email = 3;
  string role = 4;
}

message AddUserRequest {
  string name = 1;
  string email = 2;
  string role = 3;
}

message UserResponse {
  User user = 1;
}

message GetAllUsersRequest {}

message UserListResponse {
  repeated User users = 1;    // "repeated" = a list
}